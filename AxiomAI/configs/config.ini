# =============================================================================
# AXIOM AI CONFIGURATION FILE
# =============================================================================
# This file controls the structural architecture of the Neural Network, the 
# hyperparameter tuning of the Training loop, and the file-path dependencies.
# =============================================================================

[MODEL]
# --- MIXTURE OF EXPERTS (MoE) ---
# Set to True to physically split FeedForward blocks into dynamic Expert routing arrays
use_moe = False
num_experts = 4
experts_per_token = 2

# The mathematical width of the network (e.g., 128, 256, 512, 768)
d_model = 64

# The number of Transformer Blocks (depth of the network)
n_layers = 3

# The number of Attention Heads inside each block. 
# NOTE: d_model must be cleanly divisible by n_heads!
n_heads = 4

# The multiplier for the hidden FeedForward network inside each chunk.
# Default is usually 4.0 (meaning internal FFN width is 4 * d_model)
hidden_mult = 2.0

# The base numerical stability epsilon for RMSNorm. Default: 1e-6
norm_eps = 1e-6

# Saves activation RAM during training by recomputing transformer blocks in backward.
# Useful for larger CPU/RAM-bound models; can reduce tok/s, so leave False for tiny models.
gradient_checkpointing = False

# Maximum target vocabulary (Byte-Pair Encoding max allowed merges)
vocab_size = 2096

# The absolute maximum sequence of tokens the model can process at once.
# Larger sequences drastically exponentially increase memory usage!
max_seq_len = 256


[TRAINING]
# The target device for training (strictly designed for 'cpu')
device = cpu

# The number of unique sequences to train on concurrently per forward pass.
# WARNING: If on CPU, keep this low (e.g., 4 or 8) or training will be terribly slow.
batch_size = 8

# True Batch Size = batch_size * gradient_accumulation_steps
gradient_accumulation_steps = 4

# Total epochs (passes through the entire dataset) to calculate
epochs = 25

# The peak Learning Rate before the Cosine Scheduler decays it
lr = 3e-4

# The absolute mathematical floor the Learning Rate can decay to.
# Do NOT set to 0.0 or the model will halt learning at the end of the epoch!
min_lr = 3e-5

# Penalizes the optimizer for large weights to prevent overfitting
weight_decay = 0.01

# Multiplier for the MoE routing balancing loss. 0.01 is standard.
moe_aux_loss_coef = 0.01

# Percentage of total steps spent warming up the Learning Rate. Default 0.05 (5%)
warmup_ratio = 0.05

# Halts training if Validation Loss stops improving for N epochs in a row
early_stopping_patience = 5

# Hard limit for validation set batches per epoch to avoid infinitely validating massive datasets
max_val_steps = 200

# --- PERFORMANCE TUNING ---

# If True, streams data directly from disk. Slow for small datasets, required for
# massive multi-gigabyte datasets to prevent crashing system RAM.
use_mmap = true

# Number of parallel CPU threads to dedicate to loading batches.
# Note: On Windows, values > 0 can sometimes cause multiprocessing crashes.
num_workers = 0

# Number of CPU threads PyTorch will use for matrix math (0 = auto/all cores).
# Tip: Set this to your PHYSICAL core count (not logical) to prevent
# hyper-threading cache thrashing and boost tok/s on CPU training.
num_threads = 8

# Target name and directory to save winning checkpoints
checkpoint_path = model/best_model.pth

# --- TRAINING EFFICIENCY ---

# 0 means use max_seq_len stride, which packs each epoch into mostly non-overlapping windows.
# Set to 1 for the old dense sliding-window behavior.
sequence_stride = 0
val_sequence_stride = 0

# Optional PyTorch graph compiler. Keep False on Pydroid unless your build supports it.
enable_torch_compile = False
torch_compile_backend = 
torch_compile_mode = reduce-overhead

# Only used when num_workers > 0.
persistent_workers = True
prefetch_factor = 2


[CHAT]
# How creatively the AI generates tokens. 
# 0.1 = Rigid/Predictable. 0.8 = Creative. 1.5 = Chaotic.
temperature = 0.8

# Caps sampling choices to only the top N most likely predictions.
top_k = 40

# Nucleus Sampling: Chops off the bottom tail of bad probabilities dynamically. 1.0 = Off.
top_p = 0.9

# Dynamically shrinks the probability of words it has already said. 1.0 = Off.
repetition_penalty = 1.15

# Absolute maximum length of generated response before forcing a stop
max_gen_length = 200


[EVAL]
# If True, logs one tiny greedy sample after each epoch. Leave False on slow/mobile runs.
enable_sample_eval = False
sample_prompt = <human>: Hello\n<gpt>:
sample_max_tokens = 40


[DATA]
# Raw conversational context file name
raw_data_path = data/pretrain/

# The physical dictionary mapping IDs to text chunks
vocab_path = tokenizer/vocab.json

# Precompiled Byte-Pair structures representing the dataset
train_path = data/processed/pretrain_train.npy
val_path = data/processed/pretrain_val.npy
