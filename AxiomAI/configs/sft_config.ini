# =============================================================================
# AXIOM AI - SUPERVISED FINE TUNING (SFT) CONFIGURATION
# =============================================================================
# This isolated file controls the Fine-Tuning Sub-Engine. 
# While the Base Pre-Trainer focuses on teaching the AI raw language capacity
# from massive datasets, this SFT Engine focuses purely on aligning the 
# model's behavior to specific human objectives using low-volatility hypers.
# =============================================================================

[MODEL]
# --- MIXTURE OF EXPERTS (MoE) ---
use_moe = False
num_experts = 4
experts_per_token = 2
gradient_checkpointing = False

# Base Model structural constraints (d_model, n_layers, etc.) 
# are now mathematically locked strictly to config.ini logic 
# and cannot drift during Fine-Tuning.


[TRAINING]
# The target device for training (strictly designed for 'cpu')
device = cpu

# The number of unique SFT sequences to train on concurrently per forward pass.
batch_size = 8

# Simulates larger batch sizes without blowing up RAM/VRAM.
gradient_accumulation_steps = 4

# Total epochs for Fine-Tuning. 
# SFT usually requires vastly fewer epochs than Pretraining since the AI 
# already intrinsically understands how to speak the language!
epochs = 55

# SFT LEARNING RATE: Crucial! Must be significantly lower than base pretraining.
# Modifying base weights too fast destroys coherence. Default Base: 3e-4
lr = 3e-5

# The absolute mathematical floor the SFT Learning Rate can decay to.
min_lr = 3e-6

# Penalizes the optimizer for large weights to prevent overfitting
weight_decay = 0.05

# Multiplier for the MoE routing balancing loss. 0.01 is standard.
moe_aux_loss_coef = 0.01

# Percentage of total steps spent warming up the Learning Rate. Default 0.1 (10%)
warmup_ratio = 0.05

early_stopping_patience = 5

# Hard limit for validation set batches per epoch to avoid infinitely validating massive datasets
max_val_steps = 200

# --- PERFORMANCE TUNING ---
use_mmap = False
num_workers = 0

# Number of CPU threads PyTorch will use for matrix math (0 = auto/all cores).
# Tip: Set this to your PHYSICAL core count (not logical) to prevent
# hyper-threading cache thrashing and boost tok/s on CPU training.
num_threads = 0

# Target name and directory to save SFT weights independently of Pretrain checkpoints!
checkpoint_path = model/sft_best_model.pth

# If False, SFT always initializes from the base checkpoint instead of reusing
# an existing SFT checkpoint. Set True only when you intentionally want to resume SFT.
resume_sft_checkpoint = False

# --- TRAINING EFFICIENCY ---

# 0 means use max_seq_len stride. Set to 1 for old dense sliding-window behavior.
sequence_stride = 128
val_sequence_stride = 128

# Optional PyTorch graph compiler. Keep False on Pydroid unless your build supports it.
enable_torch_compile = False
torch_compile_backend = 
torch_compile_mode = reduce-overhead

# Only used when num_workers > 0.
persistent_workers = True
prefetch_factor = 2


[CHAT]
# How creatively the AI generates tokens. 
temperature = 0.8

# Caps sampling choices to only the top N most likely predictions.
top_k = 40

# Nucleus Sampling: Chops off the bottom tail of bad probabilities dynamically. 1.0 = Off.
top_p = 0.9

# Dynamically shrinks the probability of words it has already said. 1.0 = Off.
repetition_penalty = 1.15

# Absolute maximum length of generated response before forcing a stop
max_gen_length = 200


[EVAL]
# If True, logs one tiny greedy sample after each epoch. Leave False on slow/mobile runs.
enable_sample_eval = False
sample_prompt = <human>: Hello\n<gpt>:
sample_max_tokens = 40


[DATA]
# Raw conversational context file name specifically for Fine-Tuning parameters
raw_data_path = data/sft/sft_dataset.jsonl

# The physical dictionary mapping IDs to text chunks.
# Both models SHARE the identical Tokenizer to correctly decode each other!
vocab_path = tokenizer/vocab.json

# Precompiled Byte-Pair structures specifically for SFT routines
train_path = data/processed/sft_train.npy
val_path = data/processed/sft_val.npy
