[VIDEO_MODEL]
# Smaller CPU/mobile-friendly Video AR. Increase d_model/layers only after the full pipeline works.
d_model = 96
n_layers = 3
n_heads = 3
hidden_mult = 3.0
codebook_size = 512
bos_id = 512
max_scale_levels = 2
max_seq_len = 2048

[TEXT_ENCODER]
# Prompt conditioner for video generation. vocab_size/max_seq_len are synced from configs/config.ini.
d_model = 96
n_layers = 2
n_heads = 4

[VAE]
# Compact VQ-VAE. Current architecture supports spatial_downsample=8 and temporal_downsample=2.
base_channels = 16
latent_channels = 4
codebook_size = 512
quantizer_chunk_size = 512
res_blocks_per_stage = 1
residual_scale = 1.0
commitment_cost = 0.25
use_ema_quantizer = True
ema_decay = 0.99
ema_eps = 1e-5
dead_code_refresh = False
dead_code_threshold = 0.01
max_code_refresh = 64
spatial_downsample = 8
temporal_downsample = 2

[TRAINING]
# Output size must be divisible by 16 for the two-scale video path.
width = 144
height = 128

batch_size = 2
text_batch_size = 8
epochs = 50
lr = 1e-4
val_split = 0.2
split_seed = 1337
device = cpu
num_threads = 0
num_workers = 0
persistent_workers = True
prefetch_factor = 2

# Quality/safety defaults.
strict_video_loading = True
fine_tune_text_encoder = False
use_latent_cache = True
rebuild_latent_cache = False
enforce_vae_quality_gate = True
min_vae_psnr_for_ar = 12.0
min_vae_code_usage_for_ar = 0.005

# VAE loss balance.
vae_l1_weight = 1.0
vae_mse_weight = 0.5
vae_vq_weight = 1.0
vae_temporal_weight = 0.1
vae_spatial_weight = 0.05
vae_grad_clip = 1.0
vae_cosine_schedule = True
vae_min_lr_ratio = 0.1

# Files.
checkpoint_path = model/video_model/video_checkpoint.pth
vae_checkpoint_path = model/video_model/vae_checkpoint.pth
text_encoder_checkpoint_path = model/video_model/text_encoder_checkpoint.pth
latent_cache_path = data/processed/video_latent_cache.pt
save_vae_recon_preview = True
preview_every_epochs = 5
preview_path = model/video_model/previews

[DATA]
video_data_path = data/Videos/
output_path = out_video/
fps = 8.0
duration = 2.0
flip_prob = 0.5
crop_pad_percent = 0.1
