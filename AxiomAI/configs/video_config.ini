[VIDEO_MODEL]
# Spatio-Temporal Transformer Architecture Configuration
# d_model: Embedded dimensionality of tokens for processing in the Transformer.
d_model = 128
# n_layers: Total number of transformer layers.
n_layers = 4
# n_heads: Number of parallel attention heads (must divide d_model evenly).
n_heads = 8
# patch_size: Resolution of the spatial grid split per frame (e.g., 4x4 pixel patches).
patch_size = 4
# bos_id: Explicit Token ID boundary for the Beginning-Of-Sequence structural token
# Should match VAE codebook_size. Runtime sync enforces this if the config drifts.
bos_id = 4096
# codebook_size: Synced from [VAE] at runtime; repeated here for exporter/model clarity.
codebook_size = 4096
# max_scale_levels: Defines total amount of hierarchical scales embedding paths.
max_scale_levels = 4
# max_seq_len: Dynamic absolute timeline positional embedding limit for frame sequences.
max_seq_len = 2048
# st_alternating: If True, interweaves spatial (intra-frame) and temporal (inter-frame) attention. Recommended True.
st_alternating = True

[TEXT_ENCODER]
# Dedicated conditioning encoder for text prompts
# d_model: Token embedding dimension for the text condition.
d_model = 128
# n_layers: Depth of the text encoder.
n_layers = 2
# n_heads: Attention heads for the text encoder.
n_heads = 4

[VAE]
# 3D Variational Autoencoder - encodes pixel video into discrete/compressed representations
# base_channels: Main channel width for the VAE. 48 is still CPU-friendly but less toy-like than 32.
base_channels = 48
# latent_channels: Output channel dimension constraint of the VAE sequence.
latent_channels = 8
# codebook_size: Determines the total amount of discrete representations if quantization is active.
codebook_size = 4096
# quantizer_chunk_size: Limits nearest-codebook lookup memory. Lower is safer on CPU/mobile, higher can be faster.
quantizer_chunk_size = 2048
# res_blocks_per_stage: More residual depth improves VAE reconstruction quality at moderate CPU cost.
res_blocks_per_stage = 2
# residual_scale: Keeps deeper residual stacks stable on small batches.
residual_scale = 0.707
# commitment_cost: How strongly encoder outputs commit to selected codebook entries.
commitment_cost = 0.25
# use_ema_quantizer: EMA codebook updates are usually stabler than direct embedding gradients.
use_ema_quantizer = True
# ema_decay: Higher is smoother/stabler, lower adapts faster to tiny datasets.
ema_decay = 0.99
ema_eps = 1e-5
# dead_code_refresh: Disabled by default; enable if codebook usage stays near zero after several epochs.
dead_code_refresh = False
dead_code_threshold = 0.01
max_code_refresh = 64
# spatial_downsample: Structural compression factor for Height/Width (e.g. 8 means an 128px frame becomes 16 tokens).
spatial_downsample = 8
# temporal_downsample: Temporal compression (e.g. 2 means compressing every 2 frames together).
temporal_downsample = 2

[TRAINING]
# Video ingestion and network dimension configuration
# width: Exact physical horizontal resolution to shape data to.
width = 144
# height: Exact physical vertical resolution to shape data to.
height = 128

# Training loop hyperparameters
# batch_size: Number of parallel video segments processed at once.
batch_size = 2
# val_split: Fraction of video clips reserved for validation if there is more than one clip.
val_split = 0.2
# split_seed: Keeps video train/val splits stable between VAE and AR runs.
split_seed = 1337
# fine_tune_text_encoder: False freezes the text encoder during video AR training for lower RAM and stabler runs.
fine_tune_text_encoder = False
# lr: Optimizer learning rate.
lr = 1e-4
# VAE loss weights: L1 preserves sharper pixels, MSE supports PSNR, temporal/spatial terms preserve motion/edges.
vae_l1_weight = 1.0
vae_mse_weight = 0.5
vae_vq_weight = 1.0
vae_temporal_weight = 0.1
vae_spatial_weight = 0.05
vae_grad_clip = 1.0
vae_cosine_schedule = True
vae_min_lr_ratio = 0.1
# AR training can warn/refuse if the saved VAE metadata says compression quality is too poor.
min_vae_psnr_for_ar = 16.0
min_vae_code_usage_for_ar = 0.005
enforce_vae_quality_gate = True
# epochs: Number of complete passes over the dataset.
epochs = 50
# device: Execution target ('auto', 'cpu', 'cuda', etc).
device = auto
# num_threads: Hard-limit on CPU thread usage. 0 defaults to maximum available physical cores.
num_threads = 0
# strict_video_loading: True rejects bad clips instead of silently replacing them with blank tensors.
strict_video_loading = True
# use_latent_cache: True precomputes VAE tokens once and trains Video AR from cached tokens.
use_latent_cache = True
# rebuild_latent_cache: True forces cache rebuild even when metadata matches.
rebuild_latent_cache = False
# latent_cache_path: Stored VAE token cache for faster/reliable Video AR training.
latent_cache_path = data/processed/video_latent_cache.pt
# save_vae_recon_preview: True saves original/reconstructed frame strips during VAE training.
save_vae_recon_preview = True
# preview_every_epochs: Save VAE preview every N epochs, plus epoch 1 and new best epochs.
preview_every_epochs = 5
# preview_path: Output folder for VAE reconstruction previews.
preview_path = model/video_model/previews
# checkpoint_path: Disk directory for the Autoregressive video model serialization.
checkpoint_path = model/video_model/video_checkpoint.pth
# vae_checkpoint_path: Disk directory for the VAE Serialization.
vae_checkpoint_path = model/video_model/vae_checkpoint.pth
# text_encoder_checkpoint_path: Disk directory for the Text Encoder standalone serialization.
text_encoder_checkpoint_path = model/video_model/text_encoder_checkpoint.pth


[DATA]
# Path to video files (.mp4) and their corresponding, identically named caption texts (.txt).
video_data_path = data/Videos/
# Output directory to save the final generated .mp4 videos.
output_path = out_video/
# fps: Output playback speed for the rendered video sequence.
fps = 8.0
# duration: Exact chronological length of the target video sequence in seconds.
duration = 2.0

# --- DATA AUGMENTATION ---
# flip_prob: Probability of horizontal flip (0.0 to 1.0). Default = 0.5
flip_prob = 0.5
# crop_pad_percent: Extra padding added before cropping (e.g. 0.1 for 10%). Default = 0.1
crop_pad_percent = 0.1
